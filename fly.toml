app = "nossobolao-backend"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT  = "3000"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = true   # Fly.io Free: dorme quando idle
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/v1/health"
    port         = 3000
    timeout      = "5s"
    type         = "http"
