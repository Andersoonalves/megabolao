name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nx precisa do histórico para affected

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint backend
        run: npx nx run backend:lint

      # Frontend lint temporariamente desabilitado (regras de acessibilidade a corrigir)
      # - name: Lint frontend
      #   run: npx nx run frontend:lint

      - name: Build shared libs
        run: npx nx run-many -t build --projects=shared-types,shared-utils

      - name: Build backend
        run: npx tsc --project apps/backend/tsconfig.app.json

      - name: Build frontend
        run: npm run build:frontend

      - name: Test backend
        run: npm run test:backend -- --passWithNoTests --forceExit

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
